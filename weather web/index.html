<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=search"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
      integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <script src="./script.js" defer></script>
    <title>Weather Web</title>
  </head>
  <body>
    <main class="main-container">
      <header class="input-container">
        <input class="city-input" placeholder="Search City" type="text" />
        <button class="search-btn">
          <span class="material-symbols-outlined"> search </span>
        </button>
      </header>
      <section class="weather-info" style="display: none;">
        <div class="location-date-container">
          <div class="location">
            <i
              class="fa-solid fa-location-dot"
              style="color: rgb(252, 246, 246)"
            ></i>
            <h4 class="country-txt">Punjab</h4>
          </div>
          <h5 class="current-date-txt regular-txt">Wed , 07 August</h5>
        </div>
        <div class="weather-summary-container">
          <img
            src="./assets/weather/clouds.svg"
            alt=""
            class="weather-summary-img"
          />
          <div class="weather-summary-info">
            <h1 class="temp-txt">29℃</h1>
            <h1 class="condition-txt regular-txt">Clouds</h1>
          </div>
        </div>

        <!-- <div class="weather-conditions-container">
          <div class="condition-item">
            <i class="fa-solid fa-droplet" style="color: rgb(207, 210, 215)"></i>
          
          <div class="condition-info">
            <h5 class="regular-txt">Humidity</h5>
            <h5 class="humidity-value regular-txt">55%</h5>
          </div>
        </div>
        
        </div> -->
        <div class="weather-condition-container">
          <div class="condition-item">
            <span>
              <i
                class="fa-solid fa-droplet"
                style="color: rgb(207, 210, 215)"
              ></i>
            </span>
            <div class="condition-info">
              <h5 class="regular-txt">Humidity</h5>
              <h5 class="humidity-value-txt regular-txt">55%</h5>
            </div>
          </div>

          <div class="condition-item">
            <span>
              <i class="fa-solid fa-wind" style="color: rgb(207, 210, 215)"></i>
            </span>
            <div class="condition-info">
              <h5 class="regular-txt">Wind Speed</h5>
              <h5 class="wind-value-txt regular-txt">2 M/s</h5>
            </div>
          </div>
        </div>
        <div class="forecast-item-container">
          <div class="forecast-item">
            <h5 class="forecast-item-date regular-txt">05 August</h5>
            <img src="./assets/weather/thunderstorm.svg" alt="" class="forecast-item-img">
            <h5 class="forecast-item-temp">29℃</h5>
          </div>
          <div class="forecast-item">
            <h5 class="forecast-item-date regular-txt">05 August</h5>
            <img src="./assets/weather/thunderstorm.svg" alt="" class="forecast-item-img">
            <h5 class="forecast-item-temp">29℃</h5>
          </div>
          <div class="forecast-item">
            <h5 class="forecast-item-date regular-txt">05 August</h5>
            <img src="./assets/weather/thunderstorm.svg" alt="" class="forecast-item-img">
            <h5 class="forecast-item-temp">29℃</h5>
          </div>
          <div class="forecast-item">
            <h5 class="forecast-item-date regular-txt">05 August</h5>
            <img src="./assets/weather/thunderstorm.svg" alt="" class="forecast-item-img">
            <h5 class="forecast-item-temp">29℃</h5>
          </div>
        </div>





      </section>


      <section class="search-city section-message">
        <img src="assets/message/search-city.png" alt="">
         <div>
          <h1 class="regular-txt">Search City</h1>
          <h4 class="regular-txt">
            Find Out The Weather Condition Of The City
          </h4>
         </div>
      </section>

       <section class="not-found section-message" style="display: none;">
        <img src="assets/message/not-found.png" alt="">
         <div>
          <h1 class="regular-txt">Search City</h1>
          <h4 class="regular-txt">
            Find Out The Weather Condition Of The City
          </h4>
         </div>
      </section>
    </main>
  </body>
</html>
